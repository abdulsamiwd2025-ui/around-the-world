<script>
(function(){
'use strict';

/* ============================================================
   CANVAS
============================================================ */
const cv  = document.getElementById('game');
const ctx = cv.getContext('2d');
const CW = cv.width, CH = cv.height;
const GROUND_Y = 415;
const GRAV = 0.86;
const THEME_DISTANCE = 2200;
const COUNTRY_PRICES = [0, 150, 250, 400, 600, 900];
const DAILY_REWARDS  = [40, 60, 90, 130, 180, 250, 500];
const GAME_VERSION   = '1.0.0';

const rand  = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>v<a?a:v>b?b:v;

function rr(x,y,w,h,r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

const P = {
  gold:'#ffd93d', goldGlow:'#ffb700', goldDeep:'#b8860b',
  mint:'#7dff9e', mintGlow:'#3ee070',
  cyan:'#8bf3ff', cyanGlow:'#4fd1ff',
  pink:'#ff6b8a', pinkGlow:'#ff3d6b',
  orange:'#ffab5a', orangeGlow:'#ff7a1a',
  text:'#f0f8ff', text2:'rgba(190,220,255,0.72)', text3:'rgba(140,170,210,0.5)'
};

/* ============================================================
   PROGRESS + SETTINGS (persistent)
============================================================ */
const progress = {
  best:0, totalCoins:0,
  unlocked:[0], startIdx:0,
  daily:{ lastClaim:null, day:0, streak:0 },
  settings:{
    sfx:true, music:true, screenShake:true, reduceMotion:false, haptics:true
  },
  played:0,          // number of runs started
  tutorialDone:false
};

function todayKey(d){
  d = d || new Date();
  return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
}
function yesterdayKey(){
  const d = new Date();
  d.setDate(d.getDate()-1);
  return todayKey(d);
}
function dailyAvailable(){
  return progress.daily.lastClaim !== todayKey();
}

function loadProgress(){
  try{
    const b = localStorage.getItem('atwBest');
    if(b) progress.best = parseInt(b,10) || 0;
    const c = localStorage.getItem('atwTotalCoins');
    if(c) progress.totalCoins = parseInt(c,10) || 0;
    const u = localStorage.getItem('atwUnlocked');
    if(u){
      const arr = JSON.parse(u);
      if(Array.isArray(arr) && arr.length > 0) progress.unlocked = arr;
    }
    if(!progress.unlocked.includes(0)) progress.unlocked.push(0);
    const s = localStorage.getItem('atwStartIdx');
    if(s) progress.startIdx = parseInt(s,10) || 0;
    if(!progress.unlocked.includes(progress.startIdx)) progress.startIdx = 0;
    const dy = localStorage.getItem('atwDaily');
    if(dy){
      const obj = JSON.parse(dy);
      if(obj && typeof obj === 'object'){
        progress.daily.lastClaim = obj.lastClaim || null;
        progress.daily.day     = parseInt(obj.day,10) || 0;
        progress.daily.streak  = parseInt(obj.streak,10) || 0;
      }
    }
    const st = localStorage.getItem('atwSettings');
    if(st){
      const o = JSON.parse(st);
      if(o && typeof o === 'object'){
        for(const k of Object.keys(progress.settings)){
          if(typeof o[k] === 'boolean') progress.settings[k] = o[k];
        }
      }
    }
    const pl = localStorage.getItem('atwPlayed');
    if(pl) progress.played = parseInt(pl,10) || 0;
    if(localStorage.getItem('atwTutorialDone') === '1') progress.tutorialDone = true;
  }catch(e){
    // fall back to defaults
  }
}
function saveProgress(){
  try{
    localStorage.setItem('atwBest', String(progress.best));
    localStorage.setItem('atwTotalCoins', String(progress.totalCoins));
    localStorage.setItem('atwUnlocked', JSON.stringify(progress.unlocked));
    localStorage.setItem('atwStartIdx', String(progress.startIdx));
    localStorage.setItem('atwDaily', JSON.stringify(progress.daily));
    localStorage.setItem('atwSettings', JSON.stringify(progress.settings));
    localStorage.setItem('atwPlayed', String(progress.played));
    localStorage.setItem('atwTutorialDone', progress.tutorialDone ? '1' : '0');
  }catch(e){}
}
loadProgress();

/* Apply settings to runtime flags */
let sfxMuted = !progress.settings.sfx;
let musicOn  = progress.settings.music;

function claimDaily(){
  const today = todayKey();
  const yest  = yesterdayKey();
  if(progress.daily.lastClaim === today) return 0;
  let newDay;
  if(progress.daily.lastClaim === yest){
    newDay = (progress.daily.day % 7) + 1;
    progress.daily.streak++;
  } else {
    newDay = 1;
    progress.daily.streak = 1;
  }
  progress.daily.day = newDay;
  progress.daily.lastClaim = today;
  const reward = DAILY_REWARDS[newDay - 1];
  progress.totalCoins += reward;
  saveProgress();
  return reward;
}

/* ============================================================
   HAPTICS
============================================================ */
function vibrate(pattern){
  if(!progress.settings.haptics) return;
  if(typeof navigator !== 'undefined' && navigator.vibrate){
    try{ navigator.vibrate(pattern); }catch(e){}
  }
}

/* ============================================================
   AUDIO
============================================================ */
let actx=null;
function initAudio(){
  if(actx) return;
  try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }
  catch(e){ actx=null; }
}
function sfx(freq,dur,type,vol,slideTo){
  if(sfxMuted||!actx) return;
  try{
    if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime+dur);
    g.gain.setValueAtTime(vol||0.05, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

const Music = {
  gain:null,nextTime:0,step:0,current:null,target:null,noiseBuf:null,
  init(){
    if(!actx) return;
    if(!this.gain){
      this.gain = actx.createGain();
      this.gain.gain.value = 0.10;
      this.gain.connect(actx.destination);
    }
    if(!this.noiseBuf){
      const len = Math.floor(actx.sampleRate*0.08);
      const b = actx.createBuffer(1,len,actx.sampleRate);
      const d = b.getChannelData(0);
      for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
      this.noiseBuf = b;
    }
    this.nextTime = actx.currentTime + 0.1;
    this.step = 0;
  },
  setTheme(t){ this.target = t.music; if(!this.current) this.current = this.target; },
  update(){
    if(!actx||!musicOn||!this.target) return;
    if(!this.gain) this.init();
    const now = actx.currentTime;
    if(this.nextTime < now) this.nextTime = now+0.02;
    if(this.current !== this.target && Math.random() < 0.08) this.current = this.target;
    const t = this.current;
    if(!t) return;
    while(this.nextTime < now+0.18){
      this.schedule(this.step, this.nextTime, t);
      this.step = (this.step+1)%64;
      this.nextTime += t.tempo;
    }
  },
  note(freq,time,dur,wave,vol){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=wave; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,time);
    g.gain.linearRampToValueAtTime(vol,time+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,time+dur);
    o.connect(g); g.connect(this.gain);
    o.start(time); o.stop(time+dur+0.05);
  },
  hat(time,vol){
    if(!this.noiseBuf) return;
    const s=actx.createBufferSource(); s.buffer=this.noiseBuf;
    const f=actx.createBiquadFilter(); f.type='highpass'; f.frequency.value=7500;
    const g=actx.createGain();
    g.gain.setValueAtTime(vol,time);
    g.gain.exponentialRampToValueAtTime(0.0001,time+0.04);
    s.connect(f); f.connect(g); g.connect(this.gain);
    s.start(time); s.stop(time+0.06);
  },
  kick(time,vol){
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(140,time);
    o.frequency.exponentialRampToValueAtTime(45,time+0.12);
    g.gain.setValueAtTime(vol,time);
    g.gain.exponentialRampToValueAtTime(0.0001,time+0.18);
    o.connect(g); g.connect(this.gain);
    o.start(time); o.stop(time+0.2);
  },
  schedule(step,time,t){
    const root=t.root, sc=t.scale;
    const oct = n => root*Math.pow(2,n/12);
    if(step%8===0 || step%8===4)
      this.note(oct(sc[0])/2, time, t.tempo*3.4, t.bassWave||'sine', 0.30);
    const li = (step*3)%sc.length;
    const lo = (step%16<8)?1:2;
    this.note(oct(sc[li])*lo, time, t.tempo*1.1, t.leadWave||'triangle', 0.11);
    if(step%4===2){
      const mi = (step*2+1)%sc.length;
      this.note(oct(sc[mi])*2, time, t.tempo*1.6, t.leadWave||'sine', 0.07);
    }
    if(step%8===0||step%8===3||step%8===6) this.kick(time,0.28);
    if(step%2===0) this.hat(time,0.06);
    if(step%4===1) this.hat(time,0.09);
  }
};

/* ============================================================
   THEMES + LANDMARKS
============================================================ */
const THEMES = [
  { id:'JAPAN', name:'JAPAN', banner:'JAPAN', short:'JP',
    sky:['#1a0a2e','#5a1a5e','#c94b7a','#ffb3c6'],
    sun:{x:660,y:250,r:72,color:'#ff5a7a',glow:'rgba(255,90,122,0.35)'},
    ground:{top:'#2a1a3a',bot:'#0a0510',accent:'#ff7aa0',style:'stone'},
    cloud:'rgba(255,180,210,0.18)', coin:'#ffb3d1', coinEdge:'#c94b7a',
    music:{root:220, scale:[0,2,4,7,9], tempo:0.30, leadWave:'sine', bassWave:'sine'},
    far:drawFuji, mid:drawTorii, near:drawBlossoms },
  { id:'EGYPT', name:'EGYPT', banner:'EGYPT', short:'EG',
    sky:['#1a0520','#7a2410','#e8701c','#ffd17a'],
    sun:{x:730,y:220,r:58,color:'#ffd166',glow:'rgba(255,209,102,0.4)'},
    ground:{top:'#5a3a10',bot:'#1a0e02',accent:'#ffd166',style:'sand'},
    cloud:'rgba(255,200,140,0.14)', coin:'#ffd93d', coinEdge:'#b8860b',
    music:{root:146.83, scale:[0,1,5,7,8], tempo:0.32, leadWave:'triangle', bassWave:'sine'},
    far:drawPyramids, mid:drawPalms, near:drawDunes },
  { id:'PARIS', name:'PARIS', banner:'PARIS', short:'FR',
    sky:['#2a1b3d','#6a3a6a','#c97aa8','#ffd6e0'],
    sun:{x:240,y:180,r:44,color:'#fff5e0',glow:'rgba(255,245,224,0.4)'},
    ground:{top:'#3a2a3a',bot:'#100810',accent:'#e0b0d0',style:'cobble'},
    cloud:'rgba(255,220,240,0.22)', coin:'#f0d0e0', coinEdge:'#a06080',
    music:{root:196, scale:[0,2,4,5,7,9,11], tempo:0.30, leadWave:'sine', bassWave:'sine'},
    far:drawEiffel, mid:drawParisBlocks, near:drawLamps },
  { id:'NEWYORK', name:'NEW YORK', banner:'NEW YORK', short:'US',
    sky:['#02030a','#0a1230','#1a2a5a','#3a4a80'],
    sun:{x:800,y:120,r:34,color:'#e8f0ff',glow:'rgba(200,220,255,0.4)'},
    ground:{top:'#1a1e2a',bot:'#05070d',accent:'#6ab0ff',style:'asphalt'},
    cloud:'rgba(180,200,240,0.10)', coin:'#8bf3ff', coinEdge:'#2f6fe0',
    music:{root:130.81, scale:[0,3,5,7,10], tempo:0.28, leadWave:'square', bassWave:'triangle'},
    far:drawNYCSkyline, mid:drawNYCBlocks, near:drawStreetLights },
  { id:'INDIA', name:'INDIA', banner:'INDIA', short:'IN',
    sky:['#1a0a20','#5a1a3a','#d06040','#ffc48a'],
    sun:{x:480,y:260,r:68,color:'#ff9a5a',glow:'rgba(255,154,90,0.42)'},
    ground:{top:'#4a2a20',bot:'#1a0a05',accent:'#ffb37b',style:'marble'},
    cloud:'rgba(255,200,170,0.16)', coin:'#ffd93d', coinEdge:'#b07020',
    music:{root:174.61, scale:[0,1,4,5,7,8,11], tempo:0.30, leadWave:'triangle', bassWave:'sine'},
    far:drawTaj, mid:drawPalace, near:drawTrees },
  { id:'BRAZIL', name:'BRAZIL', banner:'BRAZIL', short:'BR',
    sky:['#0a1a3a','#2a4a7a','#5a9ad0','#ffd98a'],
    sun:{x:740,y:200,r:62,color:'#ffe58a',glow:'rgba(255,229,138,0.35)'},
    ground:{top:'#3a2a10',bot:'#100a02',accent:'#7ee08a',style:'sand'},
    cloud:'rgba(255,240,220,0.20)', coin:'#ffe066', coinEdge:'#d0a020',
    music:{root:164.81, scale:[0,2,4,5,7,9,10], tempo:0.27, leadWave:'sawtooth', bassWave:'triangle'},
    far:drawRioMountains, mid:drawRioPalms, near:drawBeach }
];

function drawFuji(off){
  const p=1000, st=-(((off%p)+p)%p);
  for(let x=st;x<CW+p;x+=p){
    const px=x+500, py=GROUND_Y-300;
    ctx.fillStyle='#4a2a5a';
    ctx.beginPath();
    ctx.moveTo(x,GROUND_Y+5);
    ctx.quadraticCurveTo(x+220,GROUND_Y-90,px-110,py+50);
    ctx.lineTo(px,py); ctx.lineTo(px+110,py+50);
    ctx.quadraticCurveTo(x+780,GROUND_Y-90,x+p,GROUND_Y+5);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#f0e0f0';
    ctx.beginPath();
    ctx.moveTo(px-70,py+80); ctx.lineTo(px-30,py+40); ctx.lineTo(px,py);
    ctx.lineTo(px+30,py+40); ctx.lineTo(px+70,py+80);
    ctx.lineTo(px+40,py+95); ctx.lineTo(px-40,py+95);
    ctx.closePath(); ctx.fill();
  }
}
function drawTorii(off){
  const p=460, st=-(((off%p)+p)%p);
  for(let x=st;x<CW+p;x+=p){
    ctx.fillStyle='#8a1a2a';
    ctx.fillRect(x+60,GROUND_Y-170,15,170);
    ctx.fillRect(x+185,GROUND_Y-170,15,170);
    ctx.beginPath();
    ctx.moveTo(x+35,GROUND_Y-165);
    ctx.quadraticCurveTo(x+130,GROUND_Y-185,x+225,GROUND_Y-165);
    ctx.lineTo(x+225,GROUND_Y-152);
    ctx.quadraticCurveTo(x+130,GROUND_Y-172,x+35,GROUND_Y-152);
    ctx.closePath(); ctx.fill();
    ctx.fillRect(x+55,GROUND_Y-125,150,9);
  }
}
function drawBlossoms(off){
  const p=200, st=-(((off%p)+p)%p);
  for(let x=st;x<CW+p;x+=p){
    ctx.strokeStyle='#2a0a1a'; ctx.lineWidth=6; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x+40,GROUND_Y+10);
    ctx.quadraticCurveTo(x+20,GROUND_Y-40,x+10,GROUND_Y-90);
    ctx.stroke();
    ctx.fillStyle='rgba(255,180,210,0.75)';
    for(let i=0;i<5;i++){
      const bx=x+10+Math.cos(i*1.7)*30;
      const by=GROUND_Y-90+Math.sin(i*1.7)*22;
      ctx.beginPath(); ctx.arc(bx,by,14,0,Math.PI*2); ctx.fill();
    }
  }
}
function drawPyramids(off){
  const p=900, st=-(((off%p)+p)%p);
  for(let x=st;x<CW+p;x+=p){
    ctx.fillStyle='#8a5a2a';
    ctx.beginPath();
    ctx.moveTo(x+50,GROUND_Y+5); ctx.lineTo(x+180,GROUND_Y-260); ctx.lineTo(x+310,GROUND_Y+5);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x+300,GROUND_Y+5); ctx.lineTo(x+430,GROUND_Y-200); ctx.lineTo(x+560,GROUND_Y+5);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x+560,GROUND_Y+5); ctx.lineTo(x+640,GROUND_Y-150); ctx.lineTo(x+720,GROUND_Y+5);
    ctx.closePath(); ctx.fill();
  }
}
function drawPalms(off){
  const p=240, st=-(((off%p)+p)%p);
  for(let x=st;x<CW+p;x+=p){
    ctx.strokeStyle='#3a2010'; ctx.lineWidth=8; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x+40,GROUND_Y+5);
    ctx.quadraticCurveTo(x+50,GROUND_Y-90,x+35,GROUND_Y-160);
    ctx.stroke();
    ctx.fillStyle='#2a4a1a';
    for(let i=0;i<6;i++){
      const a=-Math.PI/2+(i-2.5)*0.55;
      ctx.beginPath();
      ctx.moveTo(x+35,GROUND_Y-160);
      ctx.quadraticCurveTo(
        x+35+Math.cos(a)*50,GROUND_Y-160+Math.sin(a)*40,
        x+35+Math.cos(a)*70,GROUND_Y-160+Math.sin(a)*20);
      ctx.quadraticCurveTo(
        x+35+Math.cos(a)*40,GROUND_Y-160+Math.sin(a)*15,
        x+35,GROUND_Y-160);
      ctx.fill();
    }
  }
}
function drawDunes(off){
  const p=300, st=-(((off%p)+p)%p);
  ctx.fillStyle='rgba(200,140,70,0.55)';
  ctx.beginPath();
  ctx.moveTo(st-50,GROUND_Y+5);
  for(let x=st;x<CW+p;x+=p){
    ctx.quadraticCurveTo(x+p/2,GROUND_Y-55,x+p,GROUND_Y+5);
  }
  ctx.lineTo(CW+p,GROUND_Y+40); ctx.lineTo(st-50,GROUND_Y+40);
  ctx.closePath(); ctx.fill();
}
function drawEiffel(off){
  const p=1200, st=-(((off%p)+p)%p);
  for(let x=st;x<CW+p;x+=p){
    const cx=x+600, base=GROUND_Y+5, topY=GROUND_Y-340;
    ctx.strokeStyle='#3a2040'; ctx.lineWidth=6; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(cx-90,base);
    ctx.quadraticCurveTo(cx-40,base-160,cx-18,topY+60);
    ctx.lineTo(cx-8,topY+20); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx+90,base);
    ctx.quadraticCurveTo(cx+40,base-160,cx+18,topY+60);
    ctx.lineTo(cx+8,topY+20); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx-8,topY+20); ctx.lineTo(cx,topY-10); ctx.lineTo(cx+8,topY+20);
    ctx.stroke();

/* ============================================================

============================================================ */
function resetRun(){
  G.state='play'; G.runT=0; G.score=0; G.coins=0;
  G.speed=6; G.dist=0; G.shake=0; G.flash=0; G.overCd=0;
  G.themeIdx = progress.startIdx;
  G.nextThemeAt = THEME_DISTANCE;
  G.bannerT = 150;
  G.bannerName = currentTheme().banner;
  G.transition = 0;
  G.shopShakeIdx = -1;

  obstacles.length=0; coinList.length=0; particles.length=0;
  player.x=140; player.h=52; player.y=GROUND_Y-52;
  player.vy=0; player.onGround=true; player.jumps=0;
  player.sliding=false; player.slideT=0; player.runT=0;
  nextObsIn=80; nextCoinIn=140;

  progress.played++;
  saveProgress();

  if(actx){
    initAudio();
    Music.init();
    Music.setTheme(currentTheme());
    Music.nextTime = actx.currentTime + 0.15;
    Music.step = 0;
  }
  sfx(520,0.09,'square',0.05,880);
  vibrate(8);
}

/* ============================================================
   ACTIONS
============================================================ */
function doJump(){
  initAudio();
  if(G.state==='menu'||G.state==='daily'||G.state==='settings'){ resetRun(); return; }
  if(G.state==='over'){ if(G.overCd<=0) resetRun(); return; }
  if(G.state==='paused') return;
  if(player.sliding) endSlide();

  if(player.onGround){
    player.vy=-15.2; player.onGround=false; player.jumps=1;
    dust(player.x+player.w/2, GROUND_Y, 7);
    sfx(430,0.09,'square',0.05,780);
    vibrate(6);
  } else if(player.jumps<2){
    player.vy=-12.4; player.jumps=2;
    dust(player.x+player.w/2, player.y+player.h, 9);
    sfx(620,0.08,'square',0.05,980);
    vibrate(4);
  }
}
function startSlide(){
  if(G.state!=='play'||!player.onGround||player.sliding) return;
  player.sliding=true; player.slideT=34;
  player.h=30; player.y=GROUND_Y-30;
  dust(player.x, GROUND_Y, 6);
  sfx(210,0.12,'sawtooth',0.04,110);
  vibrate(5);
}
function endSlide(){
  if(!player.sliding) return;
  player.sliding=false; player.h=52;
  if(player.onGround) player.y=GROUND_Y-52;
}

function togglePause(){
  if(G.state==='play'){
    G.state='paused';
    sfx(560,0.10,'sine',0.05,360);
  } else if(G.state==='paused'){
    G.state='play';
    sfx(660,0.10,'sine',0.05,880);
  }
}

============================================================ */
function dust(x,y,n,col){

    particles.push({
      x,y, vx:rand(-2.4,0.6), vy:rand(-2.6,-0.4),
      life:rand(16,34), max:34, r:rand(1.8,4.6),
      c:col||[130,200,255]
    });
  }
}
function burst(x,y,n,col){
  if(progress.settings.reduceMotion) n = Math.max(4, Math.floor(n*0.4));
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, sp=rand(1.5,6);
    particles.push({
      x,y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp-1.5,
      life:rand(20,42), max:42, r:rand(2,5.5), c:col
    });
  }
}

/* ============================================================
   COLLISION
============================================================ */
function playerBox(){ return {x:player.x+6,y:player.y+3,w:player.w-12,h:player.h-6}; }
function overlaps(a,b){
  return !(b.x>a.x+a.w || b.x+b.w<a.x || b.y>a.y+a.h || b.y+b.h<a.y);
}

/* ============================================================
   GAME OVER
============================================================ */
function gameOver(){
  if(G.state!=='play') return;
  G.state='over'; G.shake=16; G.flash=1; G.overCd=45;
  sfx(190,0.35,'sawtooth',0.08,60);
  burst(player.x+player.w/2, player.y+player.h/2, 28, [255,110,150]);
  vibrate([30,40,60]);

  progress.totalCoins += G.coins;
  const s = Math.floor(G.score);
  if(s > progress.best) progress.best = s;
  saveProgress();
}

/* ============================================================
   UPDATE
============================================================ */
function update(dt){
  G.anim += dt;
  if(G.shake>0){
    const rate = progress.settings.screenShake ? 0.9 : 3.5;
    G.shake=Math.max(0,G.shake-dt*rate);
  }
  if(G.flash>0) G.flash=Math.max(0,G.flash-dt*0.05);
  if(G.overCd>0) G.overCd-=dt;
  if(G.bannerT>0) G.bannerT=Math.max(0,G.bannerT-dt);
  if(G.transition>0) G.transition=Math.max(0,G.transition-dt*0.02);
  if(G.shopShakeT>0) G.shopShakeT=Math.max(0,G.shopShakeT-dt);
  if(G.shopToastT>0) G.shopToastT=Math.max(0,G.shopToastT-dt);
  if(G.dailyFlash>0) G.dailyFlash=Math.max(0,G.dailyFlash-dt*0.04);
  if(G.settingsResetArmed>0) G.settingsResetArmed=Math.max(0,G.settingsResetArmed-dt);
  if(G.settingsToastT>0) G.settingsToastT=Math.max(0,G.settingsToastT-dt);
  if(G.menuPress && G.menuPress.t>0) G.menuPress.t -= dt;

  /* preview strip rotation */
  if(G.state==='menu' && G.previewPaused<=0){
    G.previewTimer += dt;
    if(G.previewTimer > 90){
      G.previewTimer = 0;
      G.previewIdx = (G.previewIdx+1) % THEMES.length;
    }
  } else if(G.previewPaused>0){
    G.previewPaused -= dt;
  }

  Music.update();

  for(const m of G.menuMotes){
    m.x += m.vx*dt;
    m.y += m.vy*dt;
    if(m.y < -10){ m.y = CH+10; m.x = Math.random()*CW; }
    if(m.x < -10) m.x = CW+10;
    if(m.x > CW+10) m.x = -10;
  }

  const cloudBoost = (G.state==='play')?1+G.speed*0.22:1;
  for(const c of clouds){
    c.x -= c.sp*dt*cloudBoost;
    if(c.x<-200){
      c.x=CW+rand(80,320);
      c.y=30+Math.random()*190;
      c.s=0.55+Math.random()*0.85;
    }
  }

  if(G.state==='menu'||G.state==='daily'||G.state==='settings'){
    const s=2.2*dt;
    farOff+=s*0.10; midOff+=s*0.22; nearOff+=s*0.45; groundOff+=s;
    updateParticles(dt);
    return;
  }
  if(G.state==='shop'){ updateParticles(dt); return; }
  if(G.state==='over'){ updateParticles(dt); return; }
  if(G.state==='paused'){ return; }   // freeze everything on pause

  /* PLAYING */
  G.runT += dt;
  G.speed = Math.min(15.5, 6 + G.runT*0.0038);
  const ds = G.speed*dt;
  G.dist += ds;
  G.score += ds*0.10;
  farOff+=ds*0.10; midOff+=ds*0.22; nearOff+=ds*0.45; groundOff+=ds;

  if(G.dist >= G.nextThemeAt){
    G.themeIdx = (G.themeIdx+1) % THEMES.length;
    G.nextThemeAt = G.dist + THEME_DISTANCE;
    G.bannerT = 170;
    G.bannerName = currentTheme().banner;
    G.transition = progress.settings.reduceMotion ? 0.4 : 1;
    Music.setTheme(currentTheme());
    sfx(880,0.15,'sine',0.05,1320);
  }

  if(!player.onGround){
    player.vy += GRAV*dt;
    player.y  += player.vy*dt;
    if(player.y+player.h >= GROUND_Y){
      player.y = GROUND_Y-player.h;
      player.vy=0; player.onGround=true; player.jumps=0;
      dust(player.x+player.w/2, GROUND_Y, 8);
    }
  }
  if(player.sliding){
    player.slideT -= dt;
    if(player.slideT<=0) endSlide();
  }
  player.runT += dt*(0.14 + G.speed*0.033);

  if(player.onGround && Math.random()<0.35*dt){
    const n = progress.settings.reduceMotion ? 1 : 1;
    for(let i=0;i<n;i++){
      particles.push({
        x:player.x+rand(0,player.w), y:GROUND_Y-2,
        vx:rand(-3.5,-1.2), vy:rand(-1.6,-0.3),
        life:rand(10,22), max:22, r:rand(1.5,3.5), c:[90,170,255]
      });
    }
  }

  nextObsIn -= dt;
  if(nextObsIn<=0) spawnObstacle();
  nextCoinIn -= dt;
  if(nextCoinIn<=0){ spawnCoins(); nextCoinIn=rand(170,340); }

  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];
    o.x -= ds;
    if(o.x+o.w < -60){ obstacles.splice(i,1); continue; }
    if(overlaps(playerBox(), {x:o.x,y:o.y,w:o.w,h:o.h})){ gameOver(); return; }
  }

  const hb = playerBox();
  for(let i=coinList.length-1;i>=0;i--){
    const c=coinList[i];
    c.x -= ds; c.spin += 0.16*dt;
    if(c.x<-50){ coinList.splice(i,1); continue; }
    const px=clamp(c.x,hb.x,hb.x+hb.w);
    const py=clamp(c.y,hb.y,hb.y+hb.h);
    const dx=c.x-px, dy=c.y-py;
    if(dx*dx+dy*dy < (c.r+5)*(c.r+5)){
      coinList.splice(i,1);
      G.coins++; G.score += 25;
      burst(c.x,c.y,8,[255,215,80]);
      sfx(880,0.08,'triangle',0.05,1320);
      vibrate(4);
    }
  }
  updateParticles(dt);
}
function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.vy+=0.13*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
    p.life-=dt;
    if(p.life<=0) particles.splice(i,1);
  }
}

/* ============================================================
   DRAW
============================================================ */
function draw(){
  if(G.state==='shop'){ drawShop(); return; }
  if(G.state==='settings' && G.prevState==='shop'){ drawShop(); drawSettingsModal(); return; }

  const th = currentTheme();
  ctx.save();
  if(G.shake>0.4 && progress.settings.screenShake) ctx.translate(rand(-G.shake,G.shake)*0.5, rand(-G.shake,G.shake)*0.5);

  drawSky(th);
  drawSun(th);
  th.far(farOff);
  th.mid(midOff);
  drawClouds(th);
  th.near(nearOff);
  drawGround(th);

  drawCoins(th);
  drawObstacles(th);
  drawParticles();

  if(G.state==='play'||G.state==='paused'||G.state==='over'){
    drawPlayer();
  }

  ctx.restore();

  if(G.state==='menu'||G.state==='daily'||G.state==='over'||(G.state==='settings'&&G.prevState!=='shop')){
    ctx.fillStyle='rgba(4,7,14,0.72)';
    ctx.fillRect(0,0,CW,CH);
  }

  if(G.state==='menu'||G.state==='daily'||(G.state==='settings'&&G.prevState!=='shop')){
    drawMenuMotes();
  }

  drawHUD(th);
  drawBanner();
  drawOverlays();

  if(G.state==='paused') drawPauseOverlay();
  if(G.state==='daily') drawDailyModal();
  if(G.state==='settings' && G.prevState!=='shop') drawSettingsModal();

  if(G.transition>0.01){
    ctx.fillStyle='rgba(255,255,255,'+(G.transition*0.35)+')';
    ctx.fillRect(0,0,CW,CH);
  }
  if(G.flash>0.01 && !progress.settings.reduceMotion){
    ctx.fillStyle='rgba(255,80,120,'+(G.flash*0.35)+')';
    ctx.fillRect(0,0,CW,CH);
  }
  if(G.dailyFlash>0.01 && !progress.settings.reduceMotion){
    ctx.fillStyle='rgba(255,215,80,'+(G.dailyFlash*0.28)+')';
    ctx.fillRect(0,0,CW,CH);
  }

  /* tutorial overlay on first ever run */
  if(G.state==='play' && !progress.tutorialDone && G.runT < 240){
    drawTutorialHint();
  }
}

function drawTutorialHint(){
  const a = Math.min(1, (240 - G.runT) / 60);
  ctx.save();
  ctx.globalAlpha = a * 0.9;
  ctx.textAlign='center';
  ctx.font='bold 18px ui-monospace, monospace';
  ctx.shadowColor='#000'; ctx.shadowBlur=10;
  ctx.fillStyle='#ffe680';
  ctx.fillText('TAP / SPACE  to jump  ·  double-tap for double jump', CW/2, CH-100);
  ctx.fillStyle='rgba(190,220,255,0.85)';
  ctx.font='bold 14px ui-monospace, monospace';
  ctx.fillText('SLIDE under flying birds with ↓', CW/2, CH-72);
  ctx.restore();
}

function drawMenuMotes(){
  ctx.save();
  for(const m of G.menuMotes){
    const th = THEMES[(G.themeIdx + 1) % THEMES.length];
    const a = m.a * (0.7 + 0.3*Math.sin(G.anim*0.03 + m.x*0.01));
    ctx.globalAlpha = a;
    ctx.shadowColor = th.coin;
    ctx.shadowBlur = 12;
    ctx.fillStyle = th.coin;
    ctx.beginPath();
    ctx.arc(m.x, m.y, m.r, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawSky(th){
  const g = ctx.createLinearGradient(0,0,0,GROUND_Y);
  const s=th.sky;
  for(let i=0;i<s.length;i++) g.addColorStop(i/(s.length-1), s[i]);
  ctx.fillStyle=g;
  ctx.fillRect(-40,-40,CW+80,GROUND_Y+60);
}
function drawSun(th){
  const {x:sx,y:sy,r,color,glow}=th.sun;
  const g = ctx.createRadialGradient(sx,sy,8,sx,sy,r*3.5);
  g.addColorStop(0,glow);
  g.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g;
  ctx.fillRect(sx-r*3.5, sy-r*3.5, r*7, r*7);
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(sx,sy,r,0,Math.PI*2); ctx.fill();
}
function drawClouds(th){
  for(const c of clouds){
    ctx.save();
    ctx.globalAlpha = 0.10+c.s*0.12;
    ctx.fillStyle=th.cloud;
    ctx.beginPath();
    ctx.arc(c.x,c.y,26*c.s,0,Math.PI*2);
    ctx.arc(c.x+28*c.s,c.y-9*c.s,20*c.s,0,Math.PI*2);
    ctx.arc(c.x+56*c.s,c.y,24*c.s,0,Math.PI*2);
    ctx.arc(c.x+28*c.s,c.y+9*c.s,22*c.s,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}
function drawGround(th){
  const g = ctx.createLinearGradient(0,GROUND_Y,0,CH);
  g.addColorStop(0,th.ground.top);
  g.addColorStop(1,th.ground.bot);
  ctx.fillStyle=g;
  ctx.fillRect(0,GROUND_Y,CW,CH-GROUND_Y);

  ctx.save();
  ctx.shadowColor=th.ground.accent; ctx.shadowBlur=20;
  ctx.fillStyle=th.ground.accent;
  ctx.fillRect(0,GROUND_Y-2,CW,3);
  ctx.restore();

  const p=92, st=-(((groundOff%p)+p)%p);
  if(th.ground.style==='sand'){
    ctx.fillStyle='rgba(255,220,150,0.18)';
    for(let x=st;x<CW+p;x+=p){
      ctx.beginPath();
      ctx.ellipse(x,GROUND_Y+30,40,4,0,0,Math.PI*2);
      ctx.fill();
    }
  } else if(th.ground.style==='cobble'){
    ctx.fillStyle='rgba(255,220,240,0.14)';
    for(let x=st;x<CW+p;x+=p){
      ctx.fillRect(x,GROUND_Y+18,26,6);
      ctx.fillRect(x+34,GROUND_Y+38,26,6);
    }
  } else if(th.ground.style==='asphalt'){
    ctx.fillStyle='rgba(160,200,255,0.25)';
    for(let x=st;x<CW+p;x+=p) ctx.fillRect(x,GROUND_Y+50,40,3);
  } else if(th.ground.style==='marble'){
    ctx.fillStyle='rgba(255,220,180,0.2)';
    for(let x=st;x<CW+p;x+=p){
      ctx.fillRect(x,GROUND_Y+30,30,4);
      ctx.fillRect(x+42,GROUND_Y+56,20,3);
    }
  } else if(th.ground.style==='stone'){
    ctx.fillStyle='rgba(255,180,210,0.18)';
    for(let x=st;x<CW+p;x+=p){
      ctx.fillRect(x,GROUND_Y+22,42,4);
      ctx.fillRect(x+24,GROUND_Y+52,22,3);
    }
  }
}
function drawObstacles(th){
  for(const o of obstacles){
    if(o.type==='cactus'){
      ctx.save();
      ctx.shadowColor=th.ground.accent; ctx.shadowBlur=16;
      const grd = ctx.createLinearGradient(o.x,o.y,o.x+o.w,o.y+o.h);
      grd.addColorStop(0,th.coin);
      grd.addColorStop(1,th.coinEdge);
      ctx.fillStyle=grd;
      rr(o.x,o.y,o.w,o.h,10); ctx.fill();
      if(o.arms){
        rr(o.x-12,o.y+o.h*0.34,13,o.h*0.40,6); ctx.fill();
        rr(o.x+o.w-1,o.y+o.h*0.20,13,o.h*0.36,6); ctx.fill();
      }
      ctx.restore();
      ctx.fillStyle='rgba(255,255,255,0.25)';
      rr(o.x+4,o.y+6,5,o.h-16,3); ctx.fill();
    } else {
      ctx.save();
      ctx.shadowColor='#ffd166'; ctx.shadowBlur=16;
      const cx=o.x+o.w/2, cy=o.y+o.h/2;
      const flap=Math.sin(G.anim*0.34+o.flap);
      ctx.fillStyle='#ffb703';
      ctx.beginPath();
      ctx.moveTo(cx-2,cy-2); ctx.lineTo(cx-20,cy-16-flap*12); ctx.lineTo(cx-4,cy+4);
      ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(cx+2,cy-2); ctx.lineTo(cx+18,cy-18-flap*12); ctx.lineTo(cx+6,cy+3);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ffd166';
      ctx.beginPath(); ctx.ellipse(cx,cy,16,10,0,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx+15,cy-4,8.5,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff8c42';
      ctx.beginPath();
      ctx.moveTo(cx+22,cy-5); ctx.lineTo(cx+33,cy-2); ctx.lineTo(cx+22,cy+1);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle='#141414';
      ctx.beginPath(); ctx.arc(cx+17,cy-6,2.2,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
  }
}
function drawCoins(th){
  for(const c of coinList){
    const s = 0.35 + 0.65*Math.abs(Math.cos(c.spin));
    ctx.save();
    ctx.shadowColor=th.coin; ctx.shadowBlur=15;
    ctx.fillStyle=th.coin;
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,c.r*s,c.r,0,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
    ctx.fillStyle=th.coinEdge;
    ctx.beginPath();
    ctx.ellipse(c.x,c.y,c.r*0.48*s,c.r*0.55,0,0,Math.PI*2);
    ctx.fill();
  }
}
function drawParticles(){
  for(const p of particles){
    const a = clamp(p.life/p.max,0,1);
    ctx.fillStyle='rgba('+p.c[0]+','+p.c[1]+','+p.c[2]+','+a+')';
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r*a+0.4,0,Math.PI*2);
    ctx.fill();
  }
}
function drawPlayer(){
  const p = player;
  const cx = p.x+p.w/2;
  const bottom = p.y+p.h;
  const k = clamp(1-(GROUND_Y-bottom)/240, 0.18, 1);
  ctx.globalAlpha = 0.34*k;
  ctx.fillStyle='#000';
  ctx.beginPath();
  ctx.ellipse(cx,GROUND_Y+4,24*k,7*k,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.shadowColor='#4fd1ff'; ctx.shadowBlur=18;

  if(p.sliding){
    const g = ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
    g.addColorStop(0,'#8bf3ff'); g.addColorStop(1,'#2f6fe0');
    ctx.fillStyle=g;
    rr(p.x-4,p.y+4,p.w+12,p.h-6,13); ctx.fill();
    ctx.fillStyle='#eaf6ff';
    ctx.beginPath(); ctx.arc(p.x+p.w+4,p.y+13,11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#12203a';
    rr(p.x+p.w-1,p.y+9,13,7,3); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(120,220,255,0.75)'; ctx.lineWidth=2;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(p.x-16-i*14,p.y+8+i*8);
      ctx.lineTo(p.x-40-i*18,p.y+8+i*8);
      ctx.stroke();
    }
  } else {
    const onG = p.onGround ? 1 : 0.25;
    const swingA = Math.sin(p.runT)*7*onG;
    const swingB = Math.sin(p.runT+Math.PI)*7*onG;
    ctx.fillStyle='#2b6fd6';
    rr(p.x+8+swingA, p.y+p.h-16, 9,17,4); ctx.fill();
    rr(p.x+21+swingB,p.y+p.h-16, 9,17,4); ctx.fill();
    const g = ctx.createLinearGradient(p.x,p.y,p.x,p.y+p.h);
    g.addColorStop(0,'#9df6ff'); g.addColorStop(0.5,'#4fd1ff'); g.addColorStop(1,'#2f6fe0');
    ctx.fillStyle=g;
    rr(p.x+3,p.y+3,p.w-6,p.h-14,12); ctx.fill();
    ctx.fillStyle='#ff5d8f';
    ctx.beginPath();
    ctx.moveTo(cx+7,p.y+15);
    ctx.quadraticCurveTo(
      cx+34+Math.sin(G.anim*0.30)*7,
      p.y+9+Math.cos(G.anim*0.24)*7,
      cx+46,p.y+27);
    ctx.quadraticCurveTo(cx+30,p.y+27,cx+7,p.y+23);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle='#eaf6ff';
    ctx.beginPath(); ctx.arc(cx,p.y+5,13,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#12203a';
    rr(cx-1,p.y+1,13,7,3); ctx.fill();
    ctx.fillStyle='rgba(120,240,255,0.9)';
    rr(cx+1,p.y+2,4,2.5,1); ctx.fill();
  }
  ctx.restore();
}

function drawHUD(th){
  if(G.state==='menu'||G.state==='daily'||G.state==='shop'||(G.state==='settings'&&G.prevState!=='shop')) return;

  ctx.save();
  ctx.fillStyle='rgba(8,14,26,0.55)';
  rr(16,18,210,58,12); ctx.fill();
  ctx.strokeStyle='rgba(120,200,255,0.28)';
  ctx.lineWidth=1;
  rr(16,18,210,58,12); ctx.stroke();

  ctx.font='bold 26px ui-monospace, monospace';
  ctx.textAlign='left';
  ctx.shadowColor=P.cyanGlow; ctx.shadowBlur=14;
  ctx.fillStyle=P.text;
  ctx.fillText(String(Math.floor(G.score)).padStart(5,'0'), 30, 48);
  ctx.font='bold 11px ui-monospace, monospace';
  ctx.fillStyle='rgba(140,210,255,0.7)';
  ctx.shadowBlur=6;
  ctx.fillText('SCORE', 30, 66);

  ctx.fillStyle='rgba(8,14,26,0.55)';
  rr(CW-196,18,180,58,12); ctx.fill();
  ctx.strokeStyle='rgba(255,215,80,0.35)';
  rr(CW-196,18,180,58,12); ctx.stroke();

  ctx.textAlign='right';
  ctx.font='bold 22px ui-monospace, monospace';
  ctx.fillStyle=P.gold;
  ctx.shadowColor=P.goldGlow; ctx.shadowBlur=14;
  ctx.fillText('◉ ' + G.coins, CW-30, 46);
  ctx.font='bold 11px ui-monospace, monospace';
  ctx.fillStyle='rgba(255,220,140,0.7)';
  ctx.shadowBlur=6;
  ctx.fillText('BEST ' + progress.best, CW-30, 66);

  ctx.textAlign='center';
  ctx.font='bold 12px ui-monospace, monospace';
  ctx.shadowColor=th.ground.accent; ctx.shadowBlur=10;
  ctx.fillStyle='rgba(240,248,255,0.85)';
  ctx.fillText('· ' + th.name + ' ·', CW/2, 34);

  if(G.state==='play'||G.state==='paused'){
    const prev = G.nextThemeAt - THEME_DISTANCE;
    const prog = clamp((G.dist-prev)/THEME_DISTANCE, 0, 1);
    const barW=280, barH=7;
    const bx=CW/2-barW/2, by=48;

    ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,0.09)';
    rr(bx,by,barW,barH,3.5); ctx.fill();

    ctx.save();
    ctx.shadowColor=th.ground.accent; ctx.shadowBlur=14;
    ctx.fillStyle=th.ground.accent;
    rr(bx,by,barW*prog,barH,3.5); ctx.fill();
    ctx.restore();

    ctx.fillStyle='#fff';
    ctx.shadowColor=th.coin; ctx.shadowBlur=14;
    ctx.beginPath();
    ctx.arc(bx+barW*prog, by+barH/2, 3.6, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur=0;
  }

  /* pause button (bottom-right floating) */
  if(G.state==='play'){
    const pb = getPauseBtn();
    ctx.save();
    ctx.fillStyle='rgba(8,14,26,0.7)';
    ctx.beginPath();
    ctx.arc(pb.x+pb.w/2, pb.y+pb.h/2, pb.w/2, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle='rgba(180,220,255,0.55)';
    ctx.lineWidth=2;
    ctx.shadowColor=P.cyanGlow; ctx.shadowBlur=14;
    ctx.beginPath();
    ctx.arc(pb.x+pb.w/2, pb.y+pb.h/2, pb.w/2, 0, Math.PI*2);
    ctx.stroke();
    ctx.shadowBlur=0;
    ctx.fillStyle='#eaf6ff';
    ctx.fillRect(pb.x+pb.w/2-7, pb.y+pb.h/2-10, 5, 20);
    ctx.fillRect(pb.x+pb.w/2+2, pb.y+pb.h/2-10, 5, 20);
    ctx.restore();
  }

  ctx.restore();
  ctx.textAlign='left';
}

function getPauseBtn(){
  return { x: CW-64, y: CH-64, w:48, h:48 };
}

   BANNER
============================================================ */
function drawBanner(){
  if(G.bannerT<=0) return;
  const total=170;
  const t=1-G.bannerT/total;
  let x;
  if(t<0.15) x=-CW*(1-t/0.15);
  else if(t>0.85) x=CW*(t-0.85)/0.15;
  else x=0;
  const alpha = t<0.15 ? t/0.15 : (t>0.85 ? (1-t)/0.15 : 1);

  const th = currentTheme();
  const locked = !progress.unlocked.includes(G.themeIdx);

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(CW/2+x, 140);

  ctx.fillStyle='rgba(8,14,26,0.88)';
  rr(-300,-50,600, locked ? 96 : 82, 40); ctx.fill();
  ctx.strokeStyle=th.ground.accent;
  ctx.lineWidth=2;
  ctx.shadowColor=th.ground.accent;
  ctx.shadowBlur=22;
  rr(-300,-50,600, locked ? 96 : 82, 40); ctx.stroke();

  ctx.shadowBlur=24;
  ctx.textAlign='center';
  ctx.font='bold 13px ui-monospace, monospace';
  ctx.fillStyle='rgba(220,235,255,0.65)';
  ctx.fillText('NOW ENTERING', 0, -18);

  ctx.font='bold 36px ui-monospace, monospace';
  ctx.fillStyle=th.coin;
  ctx.shadowColor=th.coin;
  ctx.fillText(G.bannerName, 0, 22);

  if(locked){
    ctx.font='bold 13px ui-monospace, monospace';
    ctx.fillStyle='rgba(255,220,140,0.85)';
    ctx.shadowColor=P.goldGlow;
    ctx.shadowBlur=14;
    ctx.fillText('🔒  UNLOCK IN SHOP  [S]', 0, 40);
  }
  ctx.restore();
  ctx.textAlign='left';
}

   BUTTONS
============================================================ */
const BTN_MENU_DAILY = { x:20,   y:20, w:150, h:42 };
const BTN_MENU_SHOP  = { x:CW-170, y:20, w:150, h:42 };
const BTN_MENU_SETTINGS = { x:20, y:CH-62, w:130, h:42 };
const BTN_MENU_PLAY   = { x:CW/2-140, y:352, w:280, h:68 };
const BTN_OVER_SHOP   = { x:CW/2-200, y:435, w:190, h:46 };
const BTN_OVER_DAILY  = { x:CW/2+10,  y:435, w:190, h:46 };
const BTN_DOUBLE_COINS = { x:CW/2-150, y:355, w:300, h:50 };
const BTN_SHOP_BACK   = { x:CW-160, y:20, w:140, h:44 };

const BTN_PAUSE_RESUME = { x:CW/2-140, y:200, w:280, h:56 };
const BTN_PAUSE_SETTINGS = { x:CW/2-140, y:270, w:280, h:56 };
const BTN_PAUSE_QUIT = { x:CW/2-140, y:340, w:280, h:56 };

const BTN_SETTINGS_CLOSE = { x:CW/2-95, y:CH-90, w:190, h:52 };

function drawButton(b, label, color, glow){
  ctx.save();
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y+b.h);
  g.addColorStop(0,'rgba(28,42,72,0.9)');
  g.addColorStop(1,'rgba(14,22,40,0.95)');
  ctx.fillStyle=g;
  rr(b.x, b.y, b.w, b.h, 11); ctx.fill();

  ctx.strokeStyle=color;
  ctx.lineWidth=2;
  ctx.shadowColor=glow||color;
  ctx.shadowBlur=18;
  rr(b.x, b.y, b.w, b.h, 11); ctx.stroke();

  ctx.shadowBlur=10;
  ctx.shadowColor=glow||color;
  ctx.fillStyle=color;
  ctx.textAlign='center';
  ctx.font='bold 14px ui-monospace, monospace';
  ctx.fillText(label, b.x + b.w/2, b.y + b.h/2 + 5);
  ctx.restore();
  ctx.textAlign='left';
}

function drawPlayButton(){
  const b = BTN_MENU_PLAY;
  const press = G.menuPress && G.menuPress.t>0;
  const scale = press ? 0.96 : 1;
  const cx = b.x + b.w/2, cy = b.y + b.h/2;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -cy);

  /* outer glow */
  ctx.save();
  ctx.shadowColor = P.mintGlow;
  ctx.shadowBlur = 40;
  const pulse = 0.85 + 0.15*Math.sin(G.anim*0.08);
  ctx.globalAlpha = pulse;
  const og = ctx.createLinearGradient(b.x, b.y, b.x, b.y+b.h);
  og.addColorStop(0,'rgba(125,255,158,0.35)');
  og.addColorStop(1,'rgba(60,200,100,0.35)');
  ctx.fillStyle = og;
  rr(b.x, b.y, b.w, b.h, 20); ctx.fill();
  ctx.restore();

  /* main gradient */
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y+b.h);
  g.addColorStop(0, '#9dffb8');
  g.addColorStop(0.5, '#5fe080');
  g.addColorStop(1, '#2ea85a');
  ctx.fillStyle = g;
  rr(b.x, b.y, b.w, b.h, 20); ctx.fill();

  /* inner highlight */
  ctx.strokeStyle = 'rgba(255,255,255,0.6)';
  ctx.lineWidth = 2;
  rr(b.x+3, b.y+3, b.w-6, b.h-6, 17); ctx.stroke();

  /* outer border */
  ctx.strokeStyle = P.mint;
  ctx.lineWidth = 3;
  ctx.shadowColor = P.mintGlow;
  ctx.shadowBlur = 22;
  rr(b.x, b.y, b.w, b.h, 20); ctx.stroke();

  /* play triangle + text */
  ctx.shadowBlur = 6;
  ctx.shadowColor = 'rgba(0,60,30,0.9)';
  ctx.fillStyle = '#0f3d22';
  ctx.beginPath();
  const triX = b.x + 78;
  const triY = b.y + b.h/2;
  ctx.moveTo(triX, triY - 14);
  ctx.lineTo(triX + 24, triY);
  ctx.lineTo(triX, triY + 14);
  ctx.closePath();
  ctx.fill();

  ctx.font = 'bold 26px ui-monospace, monospace';
  ctx.textAlign = 'left';
  ctx.fillText('PLAY', triX + 40, triY + 10);

  ctx.restore();
  ctx.textAlign = 'left';
}

/* ============================================================
   MENU OVERLAY
============================================================ */
function drawOverlays(){
  if(G.state==='menu' || G.state==='daily' || (G.state==='settings' && G.prevState!=='shop')){

function drawCountryStrip(){
  const n = THEMES.length;
  const size = 66;
  const gap = 14;
  const totalW = n*size + (n-1)*gap;
  const startX = CW/2 - totalW/2;
  const y = 280;

  for(let i=0;i<n;i++){
    const th = THEMES[i];
    const x = startX + i*(size+gap);
    const unlocked = progress.unlocked.includes(i);
    const isPreview = (G.previewIdx === i);
    const isStart = (progress.startIdx === i);

    ctx.save();

    /* glow if previewed */
    if(isPreview){
      ctx.shadowColor = th.ground.accent;
      ctx.shadowBlur = 24;
    }

    /* circular background */
    const g = ctx.createLinearGradient(x, y, x, y+size);
    g.addColorStop(0, th.sky[1]);
    g.addColorStop(1, th.ground.top);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x + size/2, y + size/2, size/2, 0, Math.PI*2);
    ctx.fill();

    /* sun/dot inside */
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = th.sun.color;
    ctx.beginPath();
    ctx.arc(x + size/2 + 12, y + size/2 - 10, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;

    /* silhouette hills */
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.beginPath();
    ctx.arc(x + size/2, y + size/2, size/2, 0, Math.PI*2);
    ctx.clip();
    ctx.beginPath();
    ctx.moveTo(x, y + size*0.72);
    ctx.quadraticCurveTo(x + size*0.3, y + size*0.48, x + size*0.5, y + size*0.72);
    ctx.quadraticCurveTo(x + size*0.7, y + size*0.55, x + size, y + size*0.72);
    ctx.lineTo(x + size, y + size);
    ctx.lineTo(x, y + size);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    /* dim if locked */
    if(!unlocked){
      ctx.fillStyle = 'rgba(4,6,14,0.68)';
      ctx.beginPath();
      ctx.arc(x + size/2, y + size/2, size/2, 0, Math.PI*2);
      ctx.fill();

      /* lock icon */
      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(220,230,255,0.65)';
      ctx.font = 'bold 22px ui-monospace, monospace';
      ctx.fillText('🔒', x + size/2, y + size/2 + 8);
      ctx.restore();
    } else {
      /* short code */
      ctx.save();
      ctx.textAlign = 'center';
      ctx.font = 'bold 14px ui-monospace, monospace';
      ctx.shadowColor = 'rgba(0,0,0,0.9)';
      ctx.shadowBlur = 6;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(th.short, x + size/2, y + size/2 + 5);
      ctx.restore();
    }

    /* border rings */
    ctx.save();
    if(isStart){
      ctx.strokeStyle = P.mint;
      ctx.lineWidth = 3;
      ctx.shadowColor = P.mintGlow;
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(x + size/2, y + size/2, size/2 + 2, 0, Math.PI*2);
      ctx.stroke();

      /* check badge */
      ctx.shadowBlur=0;
      ctx.fillStyle = P.mint;
      ctx.beginPath();
      ctx.arc(x + size - 6, y + 6, 9, 0, Math.PI*2);
      ctx.fill();
      ctx.fillStyle = '#083e20';
      ctx.font = 'bold 12px ui-monospace, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('✓', x + size - 6, y + 10);
    } else if(isPreview && unlocked){
      ctx.strokeStyle = th.ground.accent;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(x + size/2, y + size/2, size/2 + 2, 0, Math.PI*2);
      ctx.stroke();
    } else {
      ctx.strokeStyle = unlocked ? 'rgba(200,225,255,0.35)' : 'rgba(120,140,180,0.28)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x + size/2, y + size/2, size/2 + 2, 0, Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();

    /* tap hint label under preview */
    if(isPreview){
      ctx.save();
      ctx.textAlign='center';
      ctx.font='bold 11px ui-monospace, monospace';
      ctx.shadowColor = th.ground.accent;
      ctx.shadowBlur = 10;
      ctx.fillStyle = th.coin;
      ctx.fillText(th.name, x + size/2, y + size + 18);
      ctx.restore();
    }
  }
}

function drawSettingRow(x, y, w, h, row){
  const on = progress.settings[row.key];

  ctx.save();
  /* row bg */
  ctx.fillStyle='rgba(20,30,52,0.75)';
  rr(x, y, w, h, 10); ctx.fill();
  ctx.strokeStyle='rgba(120,180,255,0.18)';
  ctx.lineWidth=1;
  rr(x, y, w, h, 10); ctx.stroke();

  /* label */
  ctx.textAlign='left';
  ctx.font='bold 15px ui-monospace, monospace';
  ctx.shadowBlur=0;
  ctx.fillStyle = on ? '#eaf6ff' : 'rgba(200,220,255,0.55)';
  ctx.fillText(row.label, x + 18, y + 21);

  ctx.font='11px ui-monospace, monospace';
  ctx.fillStyle='rgba(150,180,220,0.55)';
  ctx.fillText(row.desc, x + 18, y + 36);

  /* toggle switch */
  const tw = 58, th = 28;
  const tx = x + w - tw - 16;
  const ty = y + (h - th)/2;

  /* track */
  const track = ctx.createLinearGradient(tx, ty, tx, ty+th);
  if(on){
    track.addColorStop(0,'#3ee070');
    track.addColorStop(1,'#2a9a4a');
  } else {
    track.addColorStop(0,'#2a3a55');
    track.addColorStop(1,'#1a2540');
  }
  ctx.fillStyle = track;
  rr(tx, ty, tw, th, th/2); ctx.fill();

  /* border */
  ctx.strokeStyle = on ? P.mint : 'rgba(140,170,220,0.35)';
  ctx.lineWidth = 1.5;
  if(on){ ctx.shadowColor = P.mintGlow; ctx.shadowBlur = 14; }
  rr(tx, ty, tw, th, th/2); ctx.stroke();
  ctx.shadowBlur = 0;

  /* knob */
  const knobR = th/2 - 3;
  const knobX = on ? (tx + tw - knobR - 4) : (tx + knobR + 4);
  const knobY = ty + th/2;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.arc(knobX, knobY, knobR, 0, Math.PI*2);
  ctx.fill();

  ctx.restore();
  ctx.textAlign='left';
}

function handleSettingsClick(mx, my){
  /* close */
  if(hitRect(mx,my,BTN_SETTINGS_CLOSE)){
    closeSettings();
    return;
  }

  /* rows */
  const rows = getSettingRows();
  const rowX = CW/2 - 310 + 40;
  const rowW = 620 - 80;
  for(const r of rows){
    if(mx >= rowX && mx <= rowX + rowW && my >= r.y && my <= r.y + 44){
      progress.settings[r.key] = !progress.settings[r.key];
      /* apply side effects */
      if(r.key === 'sfx'){ sfxMuted = !progress.settings.sfx; }
      if(r.key === 'music'){
        musicOn = progress.settings.music;
        const mb = document.getElementById('musicBtn');
        if(mb){
          mb.classList.toggle('on', musicOn);
          mb.textContent = musicOn ? '♪ MUSIC' : '♪ OFF';
        }
        if(musicOn){ initAudio(); Music.init(); }
      }
      saveProgress();
      sfx(progress.settings[r.key] ? 880 : 440, 0.08, 'sine', 0.05);
      vibrate(6);
      return;
    }
  }

  /* reset */
  if(G.settingsResetBtn && hitRect(mx,my,G.settingsResetBtn)){
    if(G.settingsResetArmed > 0){
      /* confirmed */
      progress.best = 0;
      progress.totalCoins = 0;
      progress.unlocked = [0];
      progress.startIdx = 0;
      progress.daily = { lastClaim:null, day:0, streak:0 };
      progress.settings = { sfx:true, music:true, screenShake:true, reduceMotion:false, haptics:true };
      progress.played = 0;
      progress.tutorialDone = false;
      saveProgress();
      sfxMuted = false; musicOn = true;
      const mb = document.getElementById('musicBtn');
      if(mb){ mb.classList.add('on'); mb.textContent='♪ MUSIC'; }
      G.settingsResetArmed = 0;
      G.settingsToast = 'PROGRESS RESET';
      G.settingsToastT = 60;
      sfx(220, 0.25, 'sawtooth', 0.08, 110);
      vibrate([40,40,60]);
    } else {
      G.settingsResetArmed = 180; // ~3 seconds
      sfx(300,0.10,'sawtooth',0.05,200);
      vibrate(20);
    }
    return;
  }
}

function getShopCards(){

  const startX = (CW-totalW)/2;
  const startY = 105;
  for(let i=0;i<THEMES.length;i++){

      x:startX + col*(cardW+gapX),

  ctx.font='bold 24px ui-monospace, monospace';
  ctx.shadowColor=P.goldGlow; ctx.shadowBlur=18;
  ctx.fillStyle=P.gold;

  drawButton(BTN_SHOP_BACK, '← BACK', P.cyan, P.cyanGlow);

  const cards = getShopCards();

      G.shopMouseX>=c.x && G.shopMouseX<=c.x+c.w &&

    ctx.textAlign='center';

    ctx.fillStyle = isErr ? '#ff8fa3' : P.mint;
    ctx.fillText(G.shopToast, CW/2, CH-52);

}

function drawShopCard(card, hovered){
  const th = THEMES[card.idx];
  const x=card.x, y=card.y, w=card.w, h=card.h;
  const unlocked = progress.unlocked.includes(card.idx);
  const selected = progress.startIdx === card.idx;
  const price = COUNTRY_PRICES[card.idx];
  const canAfford = progress.totalCoins >= price;

  let shakeX = 0;
  if(G.shopShakeT>0 && G.shopShakeIdx === card.idx){
    shakeX = Math.sin(G.shopShakeT*1.2) * (G.shopShakeT*0.4);
  }

  ctx.save();
  ctx.translate(shakeX, 0);

  const skyGrad = ctx.createLinearGradient(x, y, x, y + h*0.68);
  const s = th.sky;
  for(let i=0;i<s.length;i++) skyGrad.addColorStop(i/(s.length-1), s[i]);
  ctx.fillStyle = skyGrad;
  rr(x, y, w, h, 12); ctx.fill();

  ctx.globalAlpha=0.9;
  ctx.fillStyle = th.sun.color;
  ctx.beginPath();
  ctx.arc(x + w*0.78, y + h*0.24, 20, 0, Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;

  ctx.fillStyle = 'rgba(0,0,0,0.32)';
  ctx.beginPath();
  ctx.moveTo(x, y + h*0.60);
  ctx.quadraticCurveTo(x + w*0.20, y + h*0.34, x + w*0.35, y + h*0.60);
  ctx.quadraticCurveTo(x + w*0.55, y + h*0.42, x + w*0.72, y + h*0.60);
  ctx.quadraticCurveTo(x + w*0.88, y + h*0.48, x + w, y + h*0.60);
  ctx.lineTo(x + w, y + h*0.68);
  ctx.lineTo(x, y + h*0.68);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = th.ground.top;
  ctx.fillRect(x, y + h*0.68, w, h*0.32);
  ctx.fillStyle = th.ground.accent;
  ctx.fillRect(x, y + h*0.68 - 2, w, 2);

  if(!unlocked){
    ctx.fillStyle='rgba(4,6,14,0.72)';
    rr(x, y, w, h, 12); ctx.fill();
  }

  if(selected){
    ctx.strokeStyle=P.mint;
    ctx.lineWidth=3;
    ctx.shadowColor=P.mintGlow; ctx.shadowBlur=28;
  } else if(hovered && (unlocked || canAfford)){
    ctx.strokeStyle=P.gold;
    ctx.lineWidth=3;
    ctx.shadowColor=P.goldGlow; ctx.shadowBlur=24;
  } else if(!unlocked){
    ctx.strokeStyle = canAfford ? 'rgba(255,217,61,0.9)' : 'rgba(120,140,180,0.35)';
    ctx.lineWidth = canAfford ? 2 : 1.5;
    ctx.shadowBlur = canAfford ? 12 : 0;
    if(canAfford) ctx.shadowColor=P.goldGlow;
  } else {
    ctx.strokeStyle=th.ground.accent;
    ctx.lineWidth=2;
    ctx.shadowColor=th.ground.accent; ctx.shadowBlur=14;
  }
  rr(x, y, w, h, 12); ctx.stroke();
  ctx.shadowBlur=0;

  ctx.textAlign='center';
  ctx.font='bold 24px ui-monospace, monospace';
  ctx.shadowColor='rgba(0,0,0,0.95)'; ctx.shadowBlur=10;
  ctx.fillStyle = unlocked ? '#ffffff' : 'rgba(190,200,220,0.55)';
  ctx.fillText(th.name, x + w/2, y + 40);

  ctx.font='bold 13px ui-monospace, monospace';
  const sy = y + h - 20;

  if(!unlocked){
    if(canAfford){
      ctx.fillStyle=P.gold;
      ctx.shadowColor=P.goldGlow; ctx.shadowBlur=16;
      ctx.fillText('🔒 ' + price + ' ◉  ·  BUY', x + w/2, sy);
    } else {
      ctx.fillStyle='rgba(150,165,190,0.7)';
      ctx.shadowBlur=0;
      ctx.fillText('🔒 ' + price + ' ◉', x + w/2, sy);
    }
  } else if(selected){
    ctx.fillStyle=P.mint;
    ctx.shadowColor=P.mintGlow; ctx.shadowBlur=16;
    ctx.fillText('★ STARTING COUNTRY', x + w/2, sy);
  } else {
    ctx.fillStyle='rgba(200,235,255,0.9)';
    ctx.shadowColor=th.ground.accent; ctx.shadowBlur=10;
    ctx.fillText('TAP TO SELECT', x + w/2, sy);
  }
  ctx.restore();
}

function handleShopClick(mx, my){
  if(hitRect(mx, my, BTN_SHOP_BACK)){ closeShop(); return; }
  const cards = getShopCards();
  for(const c of cards){
    if(mx>=c.x && mx<=c.x+c.w && my>=c.y && my<=c.y+c.h){
      const idx = c.idx;
      const unlocked = progress.unlocked.includes(idx);
      const price = COUNTRY_PRICES[idx];

      if(unlocked){
        progress.startIdx = idx;
        saveProgress();
        sfx(880,0.10,'sine',0.06,1320);
        vibrate(8);
        G.shopToast = 'STARTING COUNTRY SET: ' + THEMES[idx].name;
        G.shopToastT = 55;
      } else if(progress.totalCoins >= price){
        progress.totalCoins -= price;
        progress.unlocked.push(idx);
        progress.startIdx = idx;
        saveProgress();
        sfx(660,0.15,'triangle',0.08,990);
        setTimeout(()=>sfx(880,0.15,'triangle',0.07,1320), 90);
        vibrate([20,30,20]);
        G.shopToast = 'UNLOCKED: ' + THEMES[idx].name + '!';
        G.shopToastT = 70;
      } else {
        G.shopShakeIdx = idx;
        G.shopShakeT = 26;
        G.shopToast = 'NOT ENOUGH COINS · NEED ' + price;
        G.shopToastT = 55;
        sfx(200,0.18,'sawtooth',0.06,130);
        vibrate([20,40,20]);
      }
      return;
    }
  }
}

function drawDailyCell(x, y, w, h, day, state, reward){
  ctx.save();

  let bgGrad;
  if(state === 'today'){
    bgGrad = ctx.createLinearGradient(x, y, x, y+h);
    bgGrad.addColorStop(0,'#6a4410');
    bgGrad.addColorStop(1,'#2a1a05');
  } else if(state === 'claimed'){
    bgGrad = ctx.createLinearGradient(x, y, x, y+h);
    bgGrad.addColorStop(0,'#0e3820');
    bgGrad.addColorStop(1,'#051a0e');
  } else {
    bgGrad = ctx.createLinearGradient(x, y, x, y+h);
    bgGrad.addColorStop(0,'#121a36');
    bgGrad.addColorStop(1,'#070a1a');
  }
  ctx.fillStyle = bgGrad;
  rr(x, y, w, h, 13); ctx.fill();

  const isDay7 = (day === 7);

  if(state === 'today'){
    const pulse = 0.5 + 0.5*Math.sin(G.anim*0.12);
    ctx.strokeStyle = P.gold;
    ctx.lineWidth = 3;
    ctx.shadowColor = P.goldGlow;
    ctx.shadowBlur = 22 + pulse*16;
  } else if(state === 'claimed'){
    ctx.strokeStyle = P.mint;
    ctx.lineWidth = 2;
    ctx.shadowColor = P.mintGlow;
    ctx.shadowBlur = 14;
  } else if(isDay7){
    ctx.strokeStyle = 'rgba(255,180,220,0.55)';
    ctx.lineWidth = 2;
    ctx.shadowColor = P.pinkGlow;
    ctx.shadowBlur = 12;
  } else {
    ctx.strokeStyle = 'rgba(100,130,180,0.35)';
    ctx.lineWidth = 1.5;
    ctx.shadowBlur = 0;
  }
  rr(x, y, w, h, 13); ctx.stroke();
  ctx.shadowBlur = 0;

  ctx.textAlign='center';
  ctx.font='bold 10px ui-monospace, monospace';
  if(state === 'today'){
    ctx.fillStyle = '#ffe680';
    ctx.shadowColor = P.goldGlow;
    ctx.shadowBlur = 12;
    ctx.fillText('★ TODAY', x + w/2, y + 22);
  } else {
    ctx.fillStyle = state === 'claimed' ? 'rgba(180,255,210,0.75)'
      : (isDay7 ? 'rgba(255,200,230,0.75)' : 'rgba(150,180,220,0.55)');
    ctx.shadowBlur = 0;
    ctx.fillText('DAY ' + day, x + w/2, y + 22);
  }

  if(state === 'claimed'){
    ctx.shadowColor = P.mintGlow;
    ctx.shadowBlur = 18;
    ctx.fillStyle = P.mint;
    ctx.font = 'bold 42px ui-monospace, monospace';
    ctx.fillText('✓', x + w/2, y + h/2 + 18);
  } else {
    const cy = y + h/2 - 6;
    const cs = state === 'today' ? 15 : 12;
    const coinCol = state === 'today' ? P.gold : (isDay7 ? P.pink : 'rgba(140,160,200,0.55)');
    const coinEdge = state === 'today' ? P.goldDeep : (isDay7 ? '#a03060' : 'rgba(80,100,140,0.4)');

    ctx.shadowColor = state === 'today' ? P.goldGlow : (isDay7 ? P.pinkGlow : 'transparent');
    ctx.shadowBlur  = state === 'today' ? 18 : (isDay7 ? 10 : 0);

    ctx.fillStyle = coinCol;
    ctx.beginPath();
    ctx.ellipse(x + w/2, cy, cs, cs*1.15, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = coinEdge;
    ctx.beginPath();
    ctx.ellipse(x + w/2, cy, cs*0.5, cs*0.55, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.shadowBlur = state === 'today' ? 12 : 0;
    ctx.fillStyle = state === 'today' ? '#ffe680'
      : (isDay7 ? 'rgba(255,200,230,0.85)' : 'rgba(160,190,220,0.65)');
    ctx.font = 'bold 20px ui-monospace, monospace';
    ctx.fillText('+' + reward, x + w/2, y + h - 20);
  }
  ctx.restore();
}

/* ============================================================
   HIT TEST
============================================================ */
function hitRect(mx,my,r){
  return mx>=r.x && mx<=r.x+r.w && my>=r.y && my<=r.y+r.h;
}

/* ============================================================
   POINTER INPUT
============================================================ */
cv.addEventListener('pointerdown', function(e){
  e.preventDefault();
  initAudio();
  G.lastInputWasTouch = (e.pointerType === 'touch');

  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (CW/rect.width);
  const my = (e.clientY - rect.top)  * (CH/rect.height);

  if(G.state === 'shop'){ handleShopClick(mx, my); return; }
  if(G.state === 'daily'){ handleDailyClick(mx, my); return; }
  if(G.state === 'settings'){ handleSettingsClick(mx, my); return; }

  if(G.state === 'menu'){
    if(hitRect(mx,my,BTN_MENU_SHOP)){ openShop(); return; }
    if(hitRect(mx,my,BTN_MENU_DAILY)){ openDaily(); return; }
    if(hitRect(mx,my,BTN_MENU_SETTINGS)){ openSettings(); return; }
    if(hitRect(mx,my,BTN_MENU_PLAY)){
      G.menuPress = { t: 8 };
      vibrate(10);
      resetRun();
      return;
    }
    /* tapped a country thumbnail? */
    const strip = getCountryStripHit(mx,my);
    if(strip >= 0){
      /* if unlocked, set as start directly; else open shop */
      if(progress.unlocked.includes(strip)){
        progress.startIdx = strip;
        saveProgress();
        G.previewIdx = strip;
        G.previewPaused = 90;
        sfx(880,0.10,'sine',0.06,1320);
        vibrate(8);
      } else {
        openShop();
      }
      return;
    }
    /* tapped empty space — start game too (mobile-friendly) */
    resetRun();
    return;
  }

  if(G.state === 'over'){
    /* double-coins offer takes priority over retry */
    if(G.showDoubleCoinsOffer &&
       mx >= BTN_DOUBLE_COINS.x && mx <= BTN_DOUBLE_COINS.x + BTN_DOUBLE_COINS.w &&
       my >= BTN_DOUBLE_COINS.y && my <= BTN_DOUBLE_COINS.y + BTN_DOUBLE_COINS.h){
      Ads.showRewarded('double_coins', ()=>{
        progress.totalCoins += G.coins;
        saveProgress();
        G.showDoubleCoinsOffer = false;
        sfx(880,0.10,'sine',0.06,1320);
        vibrate([20,30,20]);
        Analytics.track('double_coins_reward');
      }, ()=>{
        G.showDoubleCoinsOffer = false;
      });
      return;
    }
    if(G.overCd > 0) return;
    if(hitRect(mx,my,BTN_OVER_SHOP)){ openShop(); return; }
    if(hitRect(mx,my,BTN_OVER_DAILY)){ openDaily(); return; }
    resetRun();
    return;
  }
  if(G.state === 'paused'){
    if(hitRect(mx,my,BTN_PAUSE_RESUME)){ G.state='play'; sfx(660,0.10,'sine',0.05,880); return; }
    if(hitRect(mx,my,BTN_PAUSE_SETTINGS)){ openSettings(); return; }
    if(hitRect(mx,my,BTN_PAUSE_QUIT)){
      G.state = 'menu';
      sfx(440,0.10,'sine',0.05,300);
      return;
    }
    return;
  }

  if(G.state === 'play'){
    /* pause button */
    const pb = getPauseBtn();
    if(mx >= pb.x && mx <= pb.x+pb.w && my >= pb.y && my <= pb.y+pb.h){
      togglePause();
      return;
    }
    /* double-tap detection for slide vs jump */
    const now = performance.now();
    if(G.lastTapTime && now - G.lastTapTime < 250 && my > CH*0.6){
      startSlide();
    } else {
      doJump();
    }
    G.lastTapTime = now;
  }
}, {passive:false});

function getCountryStripHit(mx,my){
  const n = THEMES.length;
  const size = 66;
  const gap = 14;
  const totalW = n*size + (n-1)*gap;
  const startX = CW/2 - totalW/2;
  const y = 280;
  for(let i=0;i<n;i++){
    const x = startX + i*(size+gap);
    const cx = x + size/2, cy = y + size/2;
    const dx = mx-cx, dy = my-cy;
    if(dx*dx+dy*dy <= (size/2+4)*(size/2+4)) return i;
  }
  return -1;
}

cv.addEventListener('pointermove', function(e){
  const rect = cv.getBoundingClientRect();
  const mx = (e.clientX - rect.left) * (CW/rect.width);
  const my = (e.clientY - rect.top)  * (CH/rect.height);
  if(G.state === 'shop'){ G.shopMouseX = mx; G.shopMouseY = my; }
});
cv.addEventListener('pointerleave', function(){
  G.shopMouseX = -1; G.shopMouseY = -1;
});
cv.addEventListener('contextmenu', e=>e.preventDefault());

/* ============================================================
   KEYBOARD
============================================================ */
window.addEventListener('keydown', function(e){
  const k = e.key;
  if(k===' '||k==='ArrowUp'||k==='ArrowDown'||k==='ArrowLeft'||k==='ArrowRight'){
    e.preventDefault();
  }

  if(k==='s'||k==='S'){
    if(G.state==='menu'||G.state==='over') openShop();
    else if(G.state==='shop') closeShop();
    else if(G.state==='daily') openShop();
    return;
  }
  if(k==='d'||k==='D'){
    if(G.state==='menu'||G.state==='over') openDaily();
    return;
  }
  if(k==='p'||k==='P'){
    if(G.state==='play'||G.state==='paused') togglePause();
    return;
  }
  if(k==='Escape'){
    if(G.state==='shop'){ closeShop(); return; }
    if(G.state==='daily'){ closeDaily(); return; }
    if(G.state==='settings'){ closeSettings(); return; }
    if(G.state==='paused'){ G.state='play'; return; }
    return;
  }

  if(G.state==='shop'||G.state==='daily'||G.state==='settings') return;
  if(G.state==='paused') return;

  if(k===' '||k==='ArrowUp'||k==='w'||k==='W'){
    if(!e.repeat) doJump();
    return;
  }
  if(k==='ArrowDown'||k==='s'||k==='S'){
    if(!e.repeat) startSlide();
    return;
  }
  if(k==='m'||k==='M'){
    sfxMuted = !sfxMuted;
    progress.settings.sfx = !sfxMuted;
    saveProgress();
    return;
  }
  if(k==='r'||k==='R'){ resetRun(); }
}, {passive:false});

window.addEventListener('keyup', function(e){
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') endSlide();
});

document.getElementById('restart').addEventListener('click', function(){
  initAudio();
  if(G.state === 'shop' || G.state === 'daily' || G.state === 'settings') G.state = 'menu';
  resetRun();
});

const musicBtn = document.getElementById('musicBtn');
musicBtn.addEventListener('click', function(){
  musicOn = !musicOn;
  progress.settings.music = musicOn;
  saveProgress();
  musicBtn.classList.toggle('on', musicOn);
  musicBtn.textContent = musicOn ? '♪ MUSIC' : '♪ OFF';
  if(musicOn){ initAudio(); Music.init(); }
});
/* reflect saved state on load */
if(!musicOn){
  musicBtn.classList.remove('on');
  musicBtn.textContent = '♪ OFF';
}

/* ============================================================
   MAIN LOOP
============================================================ */
let last = performance.now();
function frame(now){
  let dt = (now-last)/16.6667;
  last = now;
  if(dt > 3) dt = 3;
  if(dt <= 0) dt = 1;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

requestAnimationFrame(function(t){
  last = t;
  requestAnimationFrame(frame);
});
/* ============================================================
   ANALYTICS — pluggable stub
============================================================ */
const Analytics = {
  enabled: true,
  queue: [],
  provider: 'stub',   // 'stub' | 'ga4' | 'plausible' | 'custom'
  id: '',             // GA4 measurement ID or Plausible domain
  init(){
    if(this.provider === 'ga4' && this.id && !window.gtag){
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=' + this.id;
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function(){ window.dataLayer.push(arguments); };
      window.gtag('js', new Date());
      window.gtag('config', this.id, { anonymize_ip: true });
    }
  },
  track(event, params){
    if(!this.enabled) return;
    params = params || {};
    try{
      if(this.provider === 'ga4' && window.gtag){
        window.gtag('event', event, params);
      } else if(this.provider === 'plausible' && window.plausible){
        window.plausible(event, { props: params });
      } else {
        // offline stub — console only
        if(window.__ATW_DEBUG__) console.log('[analytics]', event, params);
      }
      this.queue.push({ event, params, t: Date.now() });
      if(this.queue.length > 200) this.queue.shift();
    }catch(e){}
  }
};
Analytics.init();

/* ============================================================
   AD PROVIDER — pluggable stub (offline-safe)
============================================================ */
const Ads = {
  provider: 'stub',     // 'stub' | 'playgama' | 'crazygames' | 'poki' | 'admob'
  ready: false,
  cooldownUntil: 0,
  sessionShown: 0,
  adFree: false,        // set true if user bought "remove ads"

  init(){
    // Try to detect Playgama if it's on the page
    if(window.playgama && window.playgama.advertisement){
      this.provider = 'playgama';
      this.ready = true;
      return;
    }
    if(window.CrazyGames && window.CrazyGames.SDK){
      this.provider = 'crazygames';
      this.ready = true;
      return;
    }
    if(window.PokiSDK){
      this.provider = 'poki';
      this.ready = true;
      return;
    }
    // Capacitor AdMob plugin check
    if(window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AdMob){
      this.provider = 'admob';
      this.ready = true;
      return;
    }
    // Fallback — stub
    this.provider = 'stub';
    this.ready = true;
  },

  isReady(){ return this.ready && !this.adFree; },
  canShow(){ return this.isReady() && performance.now() >= this.cooldownUntil; },

  async showRewarded(reason, onReward, onFail){
    if(this.adFree){ onReward && onReward(); return; }
    if(!this.canShow()){ onFail && onFail(); return; }
    Analytics.track('ad_rewarded_start', { reason });

    try{
      switch(this.provider){
        case 'playgama':
          await window.playgama.advertisement.showRewarded();
          onReward && onReward();
          break;
        case 'crazygames':
          await window.CrazyGames.SDK.ad.requestAd('rewarded');
          onReward && onReward();
          break;
        case 'poki':
          window.PokiSDK.rewardedBreak().then((withReward)=>{
            if(withReward) onReward && onReward();
            else onFail && onFail();
          });
          return;
        case 'admob':
          await window.Capacitor.Plugins.AdMob.showRewardVideoAd();
          onReward && onReward();
          break;
        default:
          await this.stubAd(reason, true);
          onReward && onReward();
      }
      Analytics.track('ad_rewarded_complete', { reason });
      this.cooldownUntil = performance.now() + 20000;
      this.sessionShown++;
    }catch(e){
      Analytics.track('ad_rewarded_error', { reason, err: String(e) });
      onFail && onFail();
    }
  },

  async showInterstitial(onDone){
    if(this.adFree){ onDone && onDone(); return; }
    if(!this.canShow()){ onDone && onDone(); return; }
    Analytics.track('ad_interstitial_start');
    try{
      switch(this.provider){
        case 'playgama':
          await window.playgama.advertisement.showInterstitial();
          break;
        case 'crazygames':
          await window.CrazyGames.SDK.ad.requestAd('midgame');
          break;
        case 'poki':
          await window.PokiSDK.commercialBreak();
          break;
        case 'admob':
          await window.Capacitor.Plugins.AdMob.showInterstitial();
          break;
        default:
          await this.stubAd('interstitial', false);
      }
      this.cooldownUntil = performance.now() + 45000;
      this.sessionShown++;
    }catch(e){
      Analytics.track('ad_interstitial_error', { err: String(e) });
    }
    onDone && onDone();
  },

  /* offline-safe placeholder — replace when a real provider exists */
  stubAd(reason, isRewarded){
    return new Promise((resolve)=>{
      const overlay = document.createElement('div');
      overlay.style.cssText = `
        position:fixed;inset:0;z-index:99999;
        background:rgba(4,7,14,0.92);backdrop-filter:blur(8px);
        display:flex;align-items:center;justify-content:center;
        font-family:ui-monospace,monospace;color:#eaf6ff;
        flex-direction:column;gap:12px;
      `;
      const title = isRewarded ? 'REWARDED AD' : 'ADVERTISEMENT';
      const sub   = isRewarded ? 'watch to continue  ·  ' + reason : 'short break';
      overlay.innerHTML = `
        <div style="font-size:12px;letter-spacing:2px;color:#8bf3ff;opacity:0.7">${title}</div>
        <div style="font-size:44px;font-weight:bold;color:#ffd93d;text-shadow:0 0 20px #ffb700">3</div>
        <div style="font-size:13px;opacity:0.7">${sub}</div>
        <div style="font-size:11px;opacity:0.4;margin-top:20px">offline stub — will be replaced by real provider</div>
      `;
      document.body.appendChild(overlay);
      const num = overlay.querySelector('div:nth-child(2)');
      let n = 3;
      const iv = setInterval(()=>{
        n--;
        if(n > 0){ num.textContent = n; }
        else {
          clearInterval(iv);
          overlay.remove();
          resolve();
        }
      }, 1000);
    });
  }
};
Ads.init();

/* ============================================================
   PWA — service worker + install prompt
============================================================ */
const PWA = {
  deferredPrompt: null,
  installed: false,
  init(){
    if('serviceWorker' in navigator){
      window.addEventListener('load', ()=>{
        navigator.serviceWorker.register('sw.js').catch(()=>{});
      });
    }
    window.addEventListener('beforeinstallprompt', (e)=>{
      e.preventDefault();
      this.deferredPrompt = e;
      // Optionally show a custom install button — see drawOverlays
    });
    window.addEventListener('appinstalled', ()=>{
      this.installed = true;
      this.deferredPrompt = null;
      Analytics.track('pwa_installed');
    });
  },
  async promptInstall(){
    if(!this.deferredPrompt) return false;
    this.deferredPrompt.prompt();
    const { outcome } = await this.deferredPrompt.userChoice;
    Analytics.track('pwa_install_prompt', { outcome });
    this.deferredPrompt = null;
    return outcome === 'accepted';
  }
};
PWA.init();

/* ============================================================
   HOOK ANALYTICS INTO THE GAME
============================================================ */
/* wrap resetRun */
const _origResetRun = resetRun;
resetRun = function(){
  _origResetRun();
  Analytics.track('run_start', {
    theme: THEMES[G.themeIdx].name,
    runs: progress.played
  });
};

/* wrap gameOver */
const _origGameOver = gameOver;
gameOver = function(){
  if(G.state !== 'play') return;
  const before = G.coins;
  _origGameOver();
  Analytics.track('run_end', {
    score: Math.floor(G.score),
    coins: before,
    theme: THEMES[G.themeIdx].name,
    best: progress.best
  });
  // Offer rewarded ad on game over after a short delay
  if(!Ads.adFree && Ads.canShow() && G.coins >= 5){
    setTimeout(()=>{
      if(G.state === 'over') G.showDoubleCoinsOffer = true;
    }, 800);
  }
};

/* wrap shop purchase */
const _origHandleShopClick = handleShopClick;
handleShopClick = function(mx, my){
  const before = progress.unlocked.length;
  const beforeCoins = progress.totalCoins;
  _origHandleShopClick(mx, my);
  if(progress.unlocked.length > before){
    Analytics.track('country_unlock', {
      country: THEMES[progress.unlocked[progress.unlocked.length-1]].name,
      price: beforeCoins - progress.totalCoins
    });
  }
};

/* wrap daily claim */
const _origClaimDaily = claimDaily;
claimDaily = function(){
  const r = _origClaimDaily();
  if(r > 0){
    Analytics.track('daily_claim', {
      amount: r,
      day: progress.daily.day,
      streak: progress.daily.streak
    });
  }
  return r;
};

/* ============================================================
   DOUBLE-COINS OFFER (rewarded ad on game over)
   Draws itself on top of the game-over overlay when active.
   (BTN_DOUBLE_COINS is declared with the other buttons earlier)
============================================================ */
function drawDoubleCoinsOffer(){
  if(!G.showDoubleCoinsOffer) return;
  const b = BTN_DOUBLE_COINS;
  const pulse = 0.75 + 0.25*Math.sin(performance.now()/260);

  ctx.save();
  ctx.shadowColor = '#ffb700';
  ctx.shadowBlur = 24 + pulse*14;
  const g = ctx.createLinearGradient(b.x, b.y, b.x, b.y+b.h);
  g.addColorStop(0, '#ffe680');
  g.addColorStop(1, '#ffb700');
  ctx.fillStyle = g;
  ctx.beginPath();
  const r = 14;
  ctx.moveTo(b.x+r,b.y);
  ctx.arcTo(b.x+b.w,b.y,b.x+b.w,b.y+b.h,r);
  ctx.arcTo(b.x+b.w,b.y+b.h,b.x,b.y+b.h,r);
  ctx.arcTo(b.x,b.y+b.h,b.x,b.y,r);
  ctx.arcTo(b.x,b.y,b.x+b.w,b.y,r);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle = '#fff5c0';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.shadowBlur = 4;
  ctx.fillStyle = '#3a2000';
  ctx.font = 'bold 17px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.fillText('🎬  WATCH AD  ·  DOUBLE COINS', b.x + b.w/2, b.y + b.h/2 + 6);
  ctx.restore();
  ctx.textAlign = 'left';
}

/* hook into main draw — call drawDoubleCoinsOffer from drawOverlays when G.state === 'over' */
const _origDrawOverlays = drawOverlays;
drawOverlays = function(){
  _origDrawOverlays();
  if(G.state === 'over') drawDoubleCoinsOffer();
};

/* double-coins click is handled inside the main pointerdown handler
   (see the "over" state branch — it checks showDoubleCoinsOffer first) */

/* hide the offer when the player taps elsewhere or restarts */
const _origResetRun2 = resetRun;
resetRun = function(){
  G.showDoubleCoinsOffer = false;
  _origResetRun2();
};
})();
